<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zunda-notes</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #666666;
    --card-bg: #f5f5f5;
    --border: #e0e0e0;
    --accent: #2f7d4f;
    --accent-fg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --fg: #e8e8e8;
      --muted: #9a9a9a;
      --card-bg: #1f2227;
      --border: #2c2f35;
      --accent: #4caf7d;
      --accent-fg: #0b0d0f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 16px 64px;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    line-height: 1.7;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 8px;
  }
  p.lead {
    color: var(--muted);
    margin: 0 0 32px;
    font-size: 0.95rem;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 1.05rem;
    margin: 0 0 12px;
  }
  .url-row {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .url-box {
    flex: 1 1 260px;
    min-width: 0;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    font-size: 0.82rem;
    overflow-x: auto;
    white-space: nowrap;
  }
  button.copy {
    flex: 0 0 auto;
    background: var(--accent);
    color: var(--accent-fg);
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  button.copy:active {
    opacity: 0.8;
  }
  button.copy[data-copied="true"] {
    background: var(--muted);
  }
</style>
</head>
<body>
<main>
  <h1>zunda-notes</h1>
  <p class="lead">
    「ずんだもんAIチャンネル」の動画内容をまとめたマークダウン文章のURL一覧です。<br>
    Gemini Notebookにソースとして追加すると、その動画についてAIと対話しながら深掘りできます。<br>
    気になる動画を見つけたら、下のボタンでURLをコピーしてGemini Notebookの「ソースを追加」に貼ってください。
  </p>

  <div class="card">
    <h2>『本は消える。でも小説は残る。』＃1</h2>
    <div class="url-row">
      <div class="url-box" id="url-1">https://raw.githubusercontent.com/ishiishintaro123-glitch/zunda-notes/master/n/1.txt</div>
      <button class="copy" data-target="url-1">コピー</button>
    </div>
  </div>
</main>

<script>
function flashButton(btn, label) {
  var original = btn.textContent;
  btn.textContent = label;
  btn.dataset.copied = 'true';
  setTimeout(function () {
    btn.textContent = original;
    btn.dataset.copied = 'false';
  }, 1500);
}

function selectText(el) {
  var range = document.createRange();
  range.selectNodeContents(el);
  var sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

document.querySelectorAll('button.copy').forEach(function (btn) {
  btn.addEventListener('click', function () {
    var target = document.getElementById(btn.dataset.target);
    var text = target.textContent.trim();
    if (!navigator.clipboard || !navigator.clipboard.writeText) {
      selectText(target);
      flashButton(btn, '選択しました');
      return;
    }
    navigator.clipboard.writeText(text).then(function () {
      flashButton(btn, 'コピーしました');
    }).catch(function () {
      selectText(target);
      flashButton(btn, '選択しました');
    });
  });
});
</script>
</body>
</html>
